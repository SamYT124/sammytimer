<!DOCTYPE html>
<html>
    <head>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                height: 100%;
                overflow: hidden; 
                user-select: none;
                background-repeat: no-repeat;
                background-size: cover;
                background-position: center center;
                background-attachment: fixed;
                min-height: 100vh;
            }
            body {
                font-family: sans-serif;
                background-color: black;
                color: white; 
            }
            h1 {
                font-size: clamp(2rem, 19.53vw, 31.25rem);
                text-align: center;
                position: fixed;
                left: 0;
                width: 100%;
                top: 0;
            }
            .timer {
                position: fixed;
                display: flex;
                justify-content: center;
                align-items: center;  
            }
            .stats {
                position: absolute;
                bottom: clamp(0.875rem, 1.15rem, 1.25rem);;
                right: clamp(0.875rem, 1.15rem, 1.25rem);;
                text-align: right; 
            }
            .botrig {
                margin: 5px 0; 
                font-size: clamp(1.5rem, 2vw, 3.125rem);
                font-weight: normal; 
            }
            button:hover {
                background-color: #747474;
            }
            .toprig {
                font-size: clamp(1.5rem, 2vw, 3.125rem);
                font-weight: normal; 
                border-color: gray;
                border-width: 5px;
                width: 5%;
            }
            .setbtn {
                margin: 5px 0; 
                font-size: clamp(1.125rem, 0.925rem + 1vw, 1.5625rem);
                font-weight: normal; 
            }
            .btmlbtn {
                position: absolute;
                bottom: clamp(0.875rem, 1.15rem, 1.25rem);
                left: clamp(0.875rem, 1.15rem, 1.25rem);
                max-width: clamp(360px, 148.89px + 52.78vw, 1500px);
                width: 100%; 
                text-align: left; 
            }
            .toplbtn {
                position: absolute;
                top: 0;
                left: 0;
                max-width: clamp(360px, 148.89px + 52.78vw, 1500px);
                width: 100%; 
                text-align: left; 
            }
            .toprbtn {
                position: absolute;
                top: clamp(0.875rem, 1.15rem, 1.25rem);;
                right: clamp(0.875rem, 1.15rem, 1.25rem);;
                text-align: left; 
            }
            .centertext {
                text-align: center;
            }
            .scramble {
                text-align: center;
                font-size: 50px;
                max-width: clamp(360px, 148.89px + 52.78vw, 1500px);
                width: 100%;  
                margin: 0 auto; 
            }
            .modal-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: clamp(0.875rem, 1.15rem, 1.25rem);;
            }

            .modal-header h2 {
                margin: 0;
                font-size: clamp(0.875rem, 1.15rem, 1.25rem);;
            }
            .label {
                font-size: 20px;
                font-weight: bold;
            }
            dialog {
                border: none;
                border-radius: 8px;
                padding: 24px;
                width: 90%;
                max-width: 400px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            }
        </style>
        <title>SammyTimer v1.1</title>
    </head>
    <body>
        <h3 class="scramble" id="scramble">scramble</h3>
        <h1 id="stopw">
            0.00
        </h1>
        <div class="stats" id="stats">
            <h3 class="botrig" id="ao5">Ao5: - </h3>
            <h3 class="botrig" id="ao12">Ao12: - </h3>
            <h3 class="botrig" id="ao50">Ao50: - </h3>
            <h3 class="botrig" id="best">Best: - </h3>
            <h3 class="botrig" id="mean">Mean: - </h3>
            <h3 class="botrig" id="count">Count: - </h3>
        </div>
        <div class="btmlbtn" id="btmlbtn">
            <button id="dellast" class="botrig">Delete Last Solve</button>
            <button id="penalty" class="botrig">Mark +2</button>
            <input type="file" id="json-file-picker" accept=".json" style="display: none;">
        </div>
        <div class="toplbtn" id="toplbtn">
            <button id="openSettingsBtn" class="toprig">🛠</button>
            <button id="openTimesBtn" class="toprig">🕐︎</button>
            <button id="export" class="toprig">📤︎</button>
            <button id="import-btn" class="toprig">📥︎</button>
        </div>
        <dialog id="settings">
            <div class="modal-header">
                <h2>Settings</h2>
                <button id="closeSettingsBtn" class="close-btn">&times;</button>
            </div>
            <div class="setting-item">
                <label class="label">🖵 UI:</label>
                <div>
                    <button id="bgPickerButton" class="setbtn">BG Color</button>
                    <button id="statPickerButton" class="setbtn">Stats Text Color</button>
                    <input type="color" id="bgColorPicker" value="#4A90E2" style="display: none;">
                    <input type="color" id="statColorPicker" value="#4A90E2" style="display: none;">
                    <button id="scramPickerButton" class="setbtn">Scramble Text Color</button>
                    <input type="color" id="scramColorPicker" value="#4A90E2" style="display: none;">
                    <button id="btnPickerButton" class="setbtn">Button BG Color</button>
                    <input type="color" id="btnColorPicker" value="#4A90E2" style="display: none;">
                    <button id="btntxtPickerButton" class="setbtn">Button Text Color</button>
                    <input type="color" id="btntxtColorPicker" value="#4A90E2" style="display: none;">
                    <br>
                    <label class="label">Font : </label>
                    <select id="font" class="setbtn">
                        <option value="roboto">Roboto</option>
                        <option value="verdana">Verdana</option>
                        <option value="courn">Courier New</option>
                        <option value="georgia">Georgia</option>
                        <option value="tnr">Times New Roman</option>
                        <option value="trebuchet">Trebuchet MS</option>
                    </select>
                    <br>
                    <label class="label">BG Image : </label>
                    <input type="url" id="bg-url" placeholder="https://example.com">
                    <button id="apply-bg" class="setbtn">Apply</button>
                    <br>
                    <label class="label">Timer Scale : </label>
                    <input type="range" id="size-slider" min="50" max="150" value="100" oninput="scaleText(this.value)">
                    <span id="percentage-label">100%</span>
                </div> 
                <br>
                <hr>
                <br>
                <label class="label">◴ Timer:</label>
                <div>
                    <button id="inspection" class="setbtn">Inspection : OFF</button>
                    <button id="huiws" class="setbtn">Hide UI While Solving : OFF</button>
                    <button id="htws" class="setbtn">Hide Timer While Solving : OFF</button>
                </div>
            </div>
        </dialog>

        <dialog id="timesList">
            <div class="modal-header">
                <h2>Times</h2>
                <button id="closeTimesBtn" class="close-btn">&times;</button>
            </div>
            <p id="timess"></p>
        </dialog>
        <div class="toprbtn" id="toprbtn">
            <label class="botrig">Cube : </label>
            <select id="cube" class="botrig">
                <option value="3x3">3x3</option>
                <option value="2x2">2x2</option>
                <option value="4x4">4x4</option>
                <option value="5x5">5x5</option>
                <option value="6x6">6x6</option>
                <option value="7x7">7x7</option>
                <option value="skewb">Skewb</option>
                <option value="pyra">Pyraminx</option>
                <option value="sq1">Square-1</option>
                <option value="mega">Megaminx</option>
                <option value="clock">Clock</option>
                <option value="fto">FTO</option>
            </select>
        </div>
    </body>
    <script src="./code.js"></script>
</html>
